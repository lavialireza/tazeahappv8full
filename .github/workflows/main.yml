name: Build Test APKs (Admin + Viewer)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Test APKs are signed with the CI debug key, have distinct .test application IDs,
# and are artifacts only. This workflow has no write token and never publishes updates.
permissions:
  contents: read

concurrency:
  group: tazieh-test-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build isolated Admin QA APK
        run: gradle :app:assembleAdminQa -PreleaseNumber=$GITHUB_RUN_NUMBER --stacktrace --warning-mode all

      - name: Build isolated Viewer QA APK
        run: gradle :app:assembleViewerQa -PreleaseNumber=$GITHUB_RUN_NUMBER --stacktrace --warning-mode all

      - name: Verify package IDs, version, and Viewer assets
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name aapt -perm -111 2>/dev/null | sort -V | tail -n 1)"
          test -n "$AAPT" && test -x "$AAPT"
          EXPECTED="${GITHUB_RUN_NUMBER}"
          ADMIN_APK="app/build/outputs/apk/admin/qa/app-admin-qa.apk"
          VIEWER_APK="app/build/outputs/apk/viewer/qa/app-viewer-qa.apk"
          test -f "$ADMIN_APK"
          test -f "$VIEWER_APK"
          ADMIN_BADGING="$("$AAPT" dump badging "$ADMIN_APK")"
          VIEWER_BADGING="$("$AAPT" dump badging "$VIEWER_APK")"
          printf '%s\n' "$ADMIN_BADGING" | grep -F "package: name='com.example.bookapp.test'"
          printf '%s\n' "$VIEWER_BADGING" | grep -F "package: name='com.example.bookapp.viewer.test'"
          for BADGING in "$ADMIN_BADGING" "$VIEWER_BADGING"; do
            CODE="$(printf '%s\n' "$BADGING" | grep -oE "versionCode='[0-9]+'" | head -n1 | sed "s/versionCode='//;s/'//")"
            test "$CODE" = "$EXPECTED"
          done
          unzip -l "$VIEWER_APK" | grep -F 'assets/content/001_sample.taz'
          if unzip -l "$VIEWER_APK" | grep -E 'assets/content/.*\.json' >/dev/null; then
            echo 'ERROR: plaintext JSON content was packaged in Viewer Test APK.'
            exit 1
          fi
          echo 'Both isolated Test APKs verified. No production publication was performed.'

      - name: Upload Admin QA APK
        uses: actions/upload-artifact@v4
        with:
          name: tazieh-admin-test-apk-${{ github.run_number }}
          path: app/build/outputs/apk/admin/qa/app-admin-qa.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Viewer QA APK
        uses: actions/upload-artifact@v4
        with:
          name: tazieh-viewer-test-apk-${{ github.run_number }}
          path: app/build/outputs/apk/viewer/qa/app-viewer-qa.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-build-reports-${{ github.run_id }}
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
